# Full stack: LibreCrawl engine + the MCP server that drives it.
#   docker compose up --build      → MCP at http://127.0.0.1:5081/mcp
# The MCP only comes up once LibreCrawl is healthy.
services:
  librecrawl:
    build:
      context: .
      dockerfile: docker/librecrawl.Dockerfile
    environment:
      - LOCAL_MODE=true
      - HOST_BINDING=0.0.0.0
    volumes:
      # Shared so the MCP can read LibreCrawl's SQLite for orphan/cleanup checks.
      - librecrawl-data:/opt/librecrawl/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/')"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      librecrawl:
        condition: service_healthy
    environment:
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=5081
      - LIBRECRAWL_URL=http://librecrawl:5000
      - REPORTS_DIR=/reports
      - LIBRECRAWL_UPSTREAM_DB=/librecrawl-data/users.db
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
      - AUDIT_FETCH_TIMEOUT_SECONDS=${AUDIT_FETCH_TIMEOUT_SECONDS:-20}
      - AUDIT_FETCH_WORKERS=${AUDIT_FETCH_WORKERS:-4}
      - AUDIT_EXTERNAL_FETCH_WORKERS=${AUDIT_EXTERNAL_FETCH_WORKERS:-8}
      - AUDIT_FETCH_DELAY_MS=${AUDIT_FETCH_DELAY_MS:-500}
      - AUDIT_CONTENT_SAMPLE_LIMIT=${AUDIT_CONTENT_SAMPLE_LIMIT:-500}
      - AUDIT_EXTENDED_SAMPLE_LIMIT=${AUDIT_EXTENDED_SAMPLE_LIMIT:-500}
      - AUDIT_FILL_SITEMAP_ORPHANS=${AUDIT_FILL_SITEMAP_ORPHANS:-true}
      - AUDIT_REPORT_PDF_ENABLED=${AUDIT_REPORT_PDF_ENABLED:-true}
      - AUDIT_MASTER_REPORT_ENABLED=${AUDIT_MASTER_REPORT_ENABLED:-true}
      - MASTER_AUDIT_V3_ENABLED=${MASTER_AUDIT_V3_ENABLED:-false}
      - MASTER_AUDIT_PSI_ENABLED=${MASTER_AUDIT_PSI_ENABLED:-true}
      - PSI_SAMPLE_LIMIT=${PSI_SAMPLE_LIMIT:-20}
      - PSI_STRATEGIES=${PSI_STRATEGIES:-mobile}
      - MASTER_AUDIT_GSC_ENABLED=${MASTER_AUDIT_GSC_ENABLED:-true}
      - GSC_ACCESS_TOKEN=${GSC_ACCESS_TOKEN:-}
      - GSC_SITE_URL=${GSC_SITE_URL:-}
      - GSC_INSPECTION_LIMIT=${GSC_INSPECTION_LIMIT:-20}
      - GSC_ANALYTICS_MAX_ROWS=${GSC_ANALYTICS_MAX_ROWS:-50000}
      - MASTER_AUDIT_SEMRUSH_ENABLED=${MASTER_AUDIT_SEMRUSH_ENABLED:-true}
      - SEMRUSH_API_KEY=${SEMRUSH_API_KEY:-}
      - SEMRUSH_TARGET=${SEMRUSH_TARGET:-}
      - SEMRUSH_LOST_LINK_LIMIT=${SEMRUSH_LOST_LINK_LIMIT:-100}
      - MASTER_AUDIT_GA4_ENABLED=${MASTER_AUDIT_GA4_ENABLED:-true}
      - GA4_ACCESS_TOKEN=${GA4_ACCESS_TOKEN:-}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID:-}
      - MASTER_AUDIT_SERVER_LOGS_ENABLED=${MASTER_AUDIT_SERVER_LOGS_ENABLED:-true}
      - SERVER_LOG_PATH=${SERVER_LOG_PATH:-}
      - SERVER_LOG_SITE_HOST=${SERVER_LOG_SITE_HOST:-}
      - SERVER_LOG_MAX_LINES=${SERVER_LOG_MAX_LINES:-1000000}
      - MASTER_AUDIT_MANUAL_REVIEW_ENABLED=${MASTER_AUDIT_MANUAL_REVIEW_ENABLED:-true}
      - MANUAL_REVIEW_INPUT_PATH=${MANUAL_REVIEW_INPUT_PATH:-}
      - MASTER_AUDIT_WORDPRESS_ENABLED=${MASTER_AUDIT_WORDPRESS_ENABLED:-false}
      - WP_AUDIT_EXPORT_PATH=${WP_AUDIT_EXPORT_PATH:-}
      - WP_AUDIT_MAX_AGE_HOURS=${WP_AUDIT_MAX_AGE_HOURS:-168}
      - MASTER_AUDIT_RENDER_ENABLED=${MASTER_AUDIT_RENDER_ENABLED:-false}
      - JS_RENDER_AUDIT_PATH=${JS_RENDER_AUDIT_PATH:-}
      - JS_RENDER_MAX_AGE_HOURS=${JS_RENDER_MAX_AGE_HOURS:-168}
      - MASTER_AUDIT_AVAILABILITY_ENABLED=${MASTER_AUDIT_AVAILABILITY_ENABLED:-false}
      - AVAILABILITY_AUDIT_PATH=${AVAILABILITY_AUDIT_PATH:-}
      - AVAILABILITY_MAX_AGE_HOURS=${AVAILABILITY_MAX_AGE_HOURS:-24}
      - AUDIT_SNAPSHOT_BASELINE_PATH=${AUDIT_SNAPSHOT_BASELINE_PATH:-}
      - AUDIT_SNAPSHOT_OUTPUT_DIR=${AUDIT_SNAPSHOT_OUTPUT_DIR:-/snapshots}
    volumes:
      - ./reports:/reports
      - librecrawl-data:/librecrawl-data:ro
      # Portable snapshots survive container recreation independently of
      # ephemeral audit sessions. Export/download remains available via MCP.
      - audit-snapshots:/snapshots
    ports:
      # Bound to loopback by default — expose deliberately on a trusted host only.
      - "127.0.0.1:5081:5081"
    restart: unless-stopped

volumes:
  librecrawl-data:
  audit-snapshots:
